[amr]
bx                   = 4                   
by                   = 4                   
bz                   = 4                   
coarse_oct_resolution_y = 1
coarse_oct_resolution_z = 1
cycle_frequency      = 99999999            
level_max            = 3                   
level_min            = 3                   
load_balancing_frequency = 99999999            
markers_kernel       = RefineCondition_mass
[cosmology]
active               = true                
astart               = 0.0196078438
da                   = 1.005               
lookup_size          = 2048                
mass_coarsen_factor  = 0.9                 
mass_refine_factor   = 8                   
omegab               = 0.049000000000000002
omegam               = 0.30000001192092896
omegav               = 0.699999988
H0 = 1
[dt]
dt_kernel            = Compute_dt_particle_velocity,Compute_dt_hydro,Compute_dt_cosmology
hydro_cfl            = 0.8                 
particle_cfl         = 0.8                          
[gravity]
cg_eps               = 1e-3                
solver               = GravitySolver_cg   
4_pi_g = 1 
[hydro]
gamma0               = 1.666               
smallp               = 1e-18               
update               = HydroUpdate_RK2     
[mesh]
boundary_type_xmax   = periodic            
boundary_type_xmin   = periodic            
boundary_type_ymax   = periodic            
boundary_type_ymin   = periodic            
boundary_type_zmax   = periodic            
boundary_type_zmin   = periodic            
ndim                 = 3                   
xmax                 = 8.0                 
xmin                 = 0.0                 
ymax                 = 1.0                 
ymin                 = 0.0                 
zmax                 = 1.0                 
zmin                 = 0.0                 
[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
output_real_type     = float               
outputdir            = ./                  
outputprefix         = zeldovitch          
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass
write_variables      = rho,rho_vx,rho_vy,rho_vz,e_tot
[particles]
update_density       = ParticleUpdate_CIC_density
update_position      = ParticleUpdate_CIC_move
[run]
enable_output        = true                
initial_conditions   = zeldovitch_pancake,particle_grid
nlog                 = 25                  
nstepmax             = 100000              
output_frequency     = 20000               
t_end_var            = aexp                
tend                 = 0.16666666666
[zeldovitch_pancake]
across               = 0.16666666666

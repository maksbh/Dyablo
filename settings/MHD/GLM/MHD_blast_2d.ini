[run]
tEnd=0.2
nStepmax=1000000
output_timeslice=0.01

initial_conditions=MHD_blast

[dt]
hydro_cfl=0.5
dt_kernel=Compute_dt_GLMMHD

[amr]
level_min=6
level_max=6

loadbalance_coherent_levels=2

markers_kernel=RefineCondition_pseudo_gradient
epsilon_refine=0.1
epsilon_coarsen=0.05

bx=4
by=4

load_balancing_frequency=100
cycle_frequency=5

[mesh]
ndim=2

xmin=0.0
xmax=1.0

ymin=0.0
ymax=1.0

boundary_type_xmin=absorbing
boundary_type_xmax=absorbing

boundary_type_ymin=absorbing
boundary_type_ymax=absorbing

[hydro]
gamma0=1.66666667
riemann=hlld
update=GLMMHDUpdate_RK2

cr=0.1

[blast]
density_in=1.0
density_out=1.0
pressure_in=10
pressure_out=0.1
radius=0.1
blast_B=1.0
blast_alpha=0.7853981633974483

[output]
outputDir=./
outputPrefix=MHD_blast_2D_block
write_variables=rho,rho_vx,rho_vy,e_tot,Bx,By


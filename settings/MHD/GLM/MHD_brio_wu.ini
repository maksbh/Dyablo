[run]                
tend=0.1     
output_timeslice=0.01               
initial_conditions=MHD_brio_wu          
nstepmax=-1

[dt]
hydro_cfl=0.4
dt_kernel=Compute_dt_GLMMHD

[amr]
level_min=7
level_max=7

bx=4                   
by=4  

coarse_oct_resolution_y=1

markers_kernel=RefineCondition_pseudo_gradient

epsilon_coarsen=0.05                
epsilon_refine=0.1                

cycle_frequency=10000000       
load_balancing_frequency=5000000                  

nboctspergroup=1024                  

[hydro]                
gamma0=2.0            
riemann=hlld  
update=GLMMHDUpdate_euler        

[mesh]
ndim=2

xmin=0.0              
xmax=1.0                

ymin=0.0                 
ymax=1.0                

boundary_type_xmax=absorbing 
boundary_type_xmin=absorbing      
boundary_type_ymax=periodic            
boundary_type_ymin=periodic      

magnetic_boundary_type_xmin=fixed_value
magnetic_boundary_type_xmax=fixed_value

Bx_xmin=0.75
By_xmin=1.0
Bz_xmin=0.0

Bx_xmax=0.75
By_xmax=-1.0
Bz_xmax=0.0

[source_terms]
updates=SourceUpdate_GLM
c_r=0.18

[brio_wu]
rhoL=1.0
pL=1.0
ByL=1.0
rhoR=0.125
pR=0.1
ByR=-1.0
Bx0=0.75
Bz0=0.0

[output]
outputdir=./                  
outputprefix=MHD_brio_wu
write_variables=rho,rho_vx,rho_vy,e_tot,Bx,By
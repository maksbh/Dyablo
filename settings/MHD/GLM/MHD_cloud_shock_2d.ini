[run]                
tend=0.1
initial_conditions=MHD_cloud_shock_interaction
nstepmax=100000
output_timeslice=0.01

[dt]
hydro_cfl=0.4
dt_kernel=Compute_dt_GLMMHD

[amr]
# 256x512 run
#level_min=7
#level_max=7
#coarse_oct_resolution_y=64

# AMR run
level_min=4
level_max=9
coarse_oct_resolution_y=8

bx=4                   
by=4                                   

markers_kernel=RefineCondition_pseudo_gradient

epsilon_coarsen=0.005                
epsilon_refine=0.01                

cycle_frequency=1               
load_balancing_frequency=5000000                  

nboctspergroup=1024                  
remap = MapUserData_linear  

[hydro]                
gamma0=1.666667               
update=GLMMHDUpdate_RK2         

[source_terms]
updates=SourceUpdate_GLM
c_r=0.18

[mesh]
ndim=2

xmin=0.0                
xmax=2.0                 

ymin=0.0                 
ymax=1.0 

boundary_type_xmax=absorbing     
boundary_type_xmin=absorbing         

boundary_type_ymax=absorbing           
boundary_type_ymin=absorbing  

[cloud_shock_interaction]
xc=1.5
yc=0.5
xs=1.2
rc=0.15

[output]
outputdir=./                  
outputprefix=cloud_shock_2d
write_variables=rho,rho_vx,rho_vy,e_tot,level,Bx,By,Bz,psi
derived_fields=DerivedFields_divB
